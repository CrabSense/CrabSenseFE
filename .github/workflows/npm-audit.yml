name: NPM Dependency Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test report validation
        run: node --test tests/npmAuditReport.test.js
      - name: Inventory full and omit-dev lockfile
        run: node scripts/npm-audit-inventory.mjs
      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-inventory
          path: audit-output/
          if-no-files-found: error
          retention-days: 14
