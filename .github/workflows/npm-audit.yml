name: NPM Dependency Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

jobs:
  inventory:
    name: Dependency Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test report validation
        run: node --test tests/npmAuditReport.test.js
      - name: Enforce zero affected packages in full and omit-dev audits
        run: node scripts/npm-audit-inventory.mjs
      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-evidence
          path: audit-output/
          if-no-files-found: error
          retention-days: 14
