name: Vite Migration Candidate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/vite-migration-candidate.yml'
      - 'scripts/vite-migration-candidate.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve Vite 8 and React plugin with strict peers and engines
        run: node scripts/vite-migration-candidate.mjs
      - name: Install candidate from regenerated lock
        run: npm ci
      - name: Node contract tests and production build
        env:
          VITE_GITHUB_PAGES: 'true'
          VITE_PAGES_BASE_PATH: /CrabSenseFE/
          VITE_API_BASE_URL: https://api.example.com/api
        run: |
          node --test tests/*.test.js
          npm run build
          grep -Fq '/CrabSenseFE/assets/' dist/index.html
      - name: Install isolated browser test dependencies
        run: npm install --prefix tests/browser --ignore-scripts --no-package-lock
      - run: node tests/browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Browser contract tests on candidate
        env:
          VITE_API_BASE_URL: http://127.0.0.1:5173/api
          VITE_GITHUB_PAGES: 'false'
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > "$RUNNER_TEMP/vite-migration-candidate.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:5173/ >/dev/null
          node tests/browser/waterBench.mjs
      - name: Require clean full and omit-dev audits on candidate
        run: |
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const s=JSON.parse(readFileSync("vite-migration-output/summary.json","utf8")); for(const scope of ["full","omit-dev"]){if(s.reports[scope]?.counts?.total!==0)throw new Error("Residual vulnerabilities: "+scope)}'
      - name: Upload candidate and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vite-migration-candidate
          path: |
            vite-migration-output/
            tests/browser/artifacts/
            ${{ runner.temp }}/vite-migration-candidate.log
          if-no-files-found: error
          retention-days: 14
