<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Crab body -->
  <ellipse cx="100" cy="100" rx="40" ry="30" fill="url(#grad1)"/>
  
  <!-- Crab claws -->
  <path d="M 60 90 Q 40 80 30 85 L 35 95 Q 45 90 60 95" fill="url(#grad1)"/>
  <path d="M 140 90 Q 160 80 170 85 L 165 95 Q 155 90 140 95" fill="url(#grad1)"/>
  
  <!-- Crab legs -->
  <line x1="70" y1="110" x2="50" y2="130" stroke="url(#grad1)" stroke-width="4"/>
  <line x1="80" y1="115" x2="65" y2="140" stroke="url(#grad1)" stroke-width="4"/>
  <line x1="130" y1="110" x2="150" y2="130" stroke="url(#grad1)" stroke-width="4"/>
  <line x1="120" y1="115" x2="135" y2="140" stroke="url(#grad1)" stroke-width="4"/>
  
  <!-- Crab eyes -->
  <circle cx="85" cy="90" r="5" fill="white"/>
  <circle cx="115" cy="90" r="5" fill="white"/>
  <circle cx="87" cy="88" r="2" fill="black"/>
  <circle cx="117" cy="88" r="2" fill="black"/>
  
  <!-- Water waves -->
  <path d="M 20 150 Q 40 140 60 150 T 100 150 T 140 150 T 180 150" 
        stroke="#4299e1" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 20 160 Q 40 155 60 160 T 100 160 T 140 160 T 180 160" 
        stroke="#4299e1" stroke-width="2" fill="none" opacity="0.4"/>
</svg>
